global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'trading-system@localhost'

route:
  group_by: ['alertname', 'category']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 5s
      repeat_interval: 30m

    - match:
        category: trading
      receiver: 'trading-alerts'
      group_wait: 5s
      repeat_interval: 15m

    - match:
        category: infrastructure
      receiver: 'infrastructure-alerts'

receivers:
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://localhost:5001/alerts'
        send_resolved: true

  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://localhost:5001/alerts/critical'
        send_resolved: true
        title: 'CRITICAL: Trading System Alert'
        text: 'Critical alert: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

  - name: 'trading-alerts'
    webhook_configs:
      - url: 'http://localhost:5001/alerts/trading'
        send_resolved: true
        title: 'Trading Alert: {{ .GroupLabels.alertname }}'
        text: |
          Trading system alert:
          {{ range .Alerts }}
          - Alert: {{ .Annotations.summary }}
          - Description: {{ .Annotations.description }}
          - Status: {{ .Status }}
          {{ end }}

  - name: 'infrastructure-alerts'
    webhook_configs:
      - url: 'http://localhost:5001/alerts/infrastructure'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']