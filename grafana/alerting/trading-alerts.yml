groups:
  - name: trading-system-alerts
    rules:
      - alert: ServiceDown
        expr: up{job=~"trading-.*"} == 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Trading service {{ $labels.instance }} is down"
          description: "Trading service {{ $labels.instance }} ({{ $labels.job }}) has been down for more than 1 minute."

      - alert: HighMessageLatency
        expr: histogram_quantile(0.95, rate(redis_operation_duration_seconds_bucket[5m])) > 0.5
        for: 2m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High Redis latency detected"
          description: "Redis P95 latency is {{ $value }}s, above 500ms threshold for 2+ minutes."

      - alert: LowMessageThroughput
        expr: rate(messages_consumed_total[5m]) < 1
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Low message throughput in {{ $labels.service }}"
          description: "Message consumption rate in {{ $labels.service }} is below 1 msg/sec for 5+ minutes."

      - alert: PortfolioValueDrop
        expr: (portfolio_value - portfolio_value offset 1h) / portfolio_value offset 1h < -0.05
        for: 1m
        labels:
          severity: warning
          category: trading
        annotations:
          summary: "Portfolio value dropped significantly"
          description: "Portfolio value dropped more than 5% in the last hour. Current: ${{ $value }}"

      - alert: UnrealizedLossHigh
        expr: unrealized_pnl < -1000
        for: 5m
        labels:
          severity: critical
          category: trading
        annotations:
          summary: "High unrealized losses detected"
          description: "Unrealized PnL is {{ $value }}, below -$1000 threshold for 5+ minutes."

      - alert: OrderExecutionFailure
        expr: increase(order_execution_errors_total[5m]) > 5
        for: 1m
        labels:
          severity: critical
          category: trading
        annotations:
          summary: "Multiple order execution failures"
          description: "{{ $value }} order execution errors in the last 5 minutes on {{ $labels.service }}."

      - alert: StrategyNotGeneratingSignals
        expr: rate(signals_generated_total[10m]) == 0
        for: 15m
        labels:
          severity: warning
          category: trading
        annotations:
          summary: "Strategy {{ $labels.strategy }} stopped generating signals"
          description: "No signals generated by {{ $labels.strategy }} for {{ $labels.symbol }} in 15+ minutes."

      - alert: BacktestJobStuck
        expr: backtest_jobs_total{status="running"} and increase(backtest_jobs_total{status="running"}[30m]) == 0
        for: 30m
        labels:
          severity: warning
          category: backtest
        annotations:
          summary: "Backtest job appears stuck"
          description: "Backtest job in running status for 30+ minutes without progress."

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / (1024*1024*1024) > 1
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High memory usage in {{ $labels.job }}"
          description: "Process {{ $labels.job }} using {{ $value }}GB RAM, above 1GB threshold."

      - alert: RedisConnectionFailure
        expr: redis_connection_failures_total > 0
        for: 1m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Redis connection failures detected"
          description: "{{ $value }} Redis connection failures in {{ $labels.service }}."

  - name: market-hours-alerts
    rules:
      - alert: TradingOutsideMarketHours
        expr: orders_executed_total and ON() (hour() < 9 or hour() > 16 or (hour() == 9 and minute() < 30))
        for: 1m
        labels:
          severity: warning
          category: trading
        annotations:
          summary: "Trading activity outside market hours"
          description: "Orders executed outside normal market hours (9:30 AM - 4:00 PM ET)."

  - name: data-quality-alerts
    rules:
      - alert: StaleMarketData
        expr: time() - last_bar_timestamp > 300
        for: 2m
        labels:
          severity: warning
          category: data
        annotations:
          summary: "Stale market data for {{ $labels.symbol }}"
          description: "No new bar data for {{ $labels.symbol }} in 5+ minutes."

      - alert: PriceDataGap
        expr: abs(bar_close_price - bar_close_price offset 1m) / bar_close_price offset 1m > 0.1
        for: 1m
        labels:
          severity: warning
          category: data
        annotations:
          summary: "Large price gap detected for {{ $labels.symbol }}"
          description: "Price changed more than 10% between bars for {{ $labels.symbol }}."