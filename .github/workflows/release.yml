name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true

env:
  PYTHON_VERSION: "3.11"
  REDIS_VERSION: "7"

jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate version format
      run: |
        if [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Valid version tag: ${{ github.ref }}"
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
        elif [[ "${{ github.event.inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Valid manual version: ${{ github.event.inputs.version }}"
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
        else
          echo "Invalid version format"
          exit 1
        fi

    - name: Check if tag exists
      if: github.event.inputs.version
      run: |
        if git rev-parse "v${{ github.event.inputs.version }}" >/dev/null 2>&1; then
          echo "Tag v${{ github.event.inputs.version }} already exists"
          exit 1
        fi

  test-all:
    name: Run All Tests
    runs-on: ubuntu-latest
    needs: validate-version

    services:
      redis:
        image: redis:${{ env.REDIS_VERSION }}-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -r requirements.txt

    - name: Run all tests
      env:
        REDIS_URL: redis://localhost:6379/15
        BUS_BACKEND: streams
        USE_FAKE_REDIS: 0
      run: |
        pytest tests/ -v --cov=apps --cov=lib

    - name: Run Epic 6 tests
      env:
        REDIS_URL: redis://localhost:6379/15
        BUS_BACKEND: streams
      run: |
        pytest tests/test_epic6_market_hours.py -v

    - name: Run Epic 7 tests
      env:
        REDIS_URL: redis://localhost:6379/15
        BUS_BACKEND: streams
      run: |
        pytest tests/test_epic7_persistence.py -v

    - name: Run system health check
      env:
        REDIS_URL: redis://localhost:6379/15
        BUS_BACKEND: streams
        USE_FAKE_REDIS: 0
      run: |
        python scripts/test_system_health.py

  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: test-all

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build distribution packages
      run: |
        python -m build

    - name: Check distribution packages
      run: |
        twine check dist/*

    - name: Create release archive
      run: |
        tar -czf trading-platform-${{ env.VERSION }}.tar.gz \
          --exclude='.git' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          --exclude='venv' \
          --exclude='out' \
          --exclude='logs' \
          --exclude='pids' \
          .

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts
        path: |
          dist/
          trading-platform-*.tar.gz

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-artifacts
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for changelog

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-artifacts

    - name: Generate changelog
      id: changelog
      run: |
        # Generate changelog from git commits
        echo "## Changes in this Release" > CHANGELOG.md
        echo "" >> CHANGELOG.md

        # Get previous tag
        PREV_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")

        if [ -n "$PREV_TAG" ]; then
          echo "Changes since $PREV_TAG:" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log $PREV_TAG..HEAD --pretty=format:"- %s (%an)" >> CHANGELOG.md
        else
          echo "Initial release" >> CHANGELOG.md
        fi

        echo "" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "## Epic Status" >> CHANGELOG.md
        echo "- ✅ Epic 1: Message Bus & Redis Streams" >> CHANGELOG.md
        echo "- ✅ Epic 2: Observability & Metrics" >> CHANGELOG.md
        echo "- ✅ Epic 4: Idempotency" >> CHANGELOG.md
        echo "- ✅ Epic 5: Order FSM" >> CHANGELOG.md
        echo "- ✅ Epic 6: Market Hours & Calendar" >> CHANGELOG.md
        echo "- ✅ Epic 7: Persistence & Reproducibility" >> CHANGELOG.md
        echo "- ✅ Epic 10: Documentation & Makefile" >> CHANGELOG.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        body_path: CHANGELOG.md
        files: |
          trading-platform-*.tar.gz
          dist/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test-all
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      continue-on-error: true

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Build and push Risk Manager image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile.risk_manager
        push: false  # Set to true when Docker Hub credentials are configured
        tags: |
          trading-platform/risk-manager:${{ steps.version.outputs.VERSION }}
          trading-platform/risk-manager:latest
      continue-on-error: true

    - name: Build and push Executor image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile.executor
        push: false
        tags: |
          trading-platform/executor:${{ steps.version.outputs.VERSION }}
          trading-platform/executor:latest
      continue-on-error: true

    - name: Build and push Simulator image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile.simulator
        push: false
        tags: |
          trading-platform/simulator:${{ steps.version.outputs.VERSION }}
          trading-platform/simulator:latest
      continue-on-error: true

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: build-artifacts
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mkdocs mkdocs-material
      continue-on-error: true

    - name: Build documentation
      run: |
        # Placeholder for documentation build
        # mkdocs build
        echo "Documentation build placeholder"
      continue-on-error: true

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
      continue-on-error: true

  notify-release:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [create-release, docker-build, deploy-docs]
    if: always() && startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Notify success
      if: needs.create-release.result == 'success'
      run: |
        echo "✅ Release ${{ steps.version.outputs.VERSION }} created successfully!"
        echo "GitHub Release: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.VERSION }}"

    - name: Notify failure
      if: needs.create-release.result != 'success'
      run: |
        echo "❌ Release ${{ steps.version.outputs.VERSION }} failed"
        exit 1
